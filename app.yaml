runtime: python312
service: apiavistidatachepita
instance_class: F2
entrypoint: gunicorn -b :$PORT --workers 1 --threads 4 --timeout 0 config.wsgi:application

automatic_scaling:
  max_instances: 2
  min_instances: 0
  target_cpu_utilization: 0.6
  max_concurrent_requests: 40

# NOTA: readiness_check / liveness_check SOLO existen en App Engine
# Flexible. En Standard (python312) el deploy falla con INVALID_ARGUMENT
# si los declaras. Standard hace su propio check interno: espera a que
# gunicorn escuche en $PORT y responda. Por eso /healthz se conserva
# como endpoint manual, no como bloque de config.
handlers:
  - url: /healthz
    script: auto
  - url: /.*
    script: auto

env_variables:
  DJANGO_SETTINGS_MODULE: "config.settings"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  DJANGO_DEBUG: "false"
  # En prod real usa Secret Manager; aquí valor temporal.
  DJANGO_SECRET_KEY: "change-me-in-production"
  DJANGO_ALLOWED_HOSTS: "*"
  DB_NAME: "db_avisti"
  DB_USER: "root"
  # NUNCA dejes password real en app.yaml (queda en historial git).
  # Rotala y pasala por Secret Manager o --set-env-vars al desplegar.
  DB_PASSWORD: "Chepita"
  DB_SOCKET_PATH: "/cloudsql/project-d5c1b1cb-efd2-47ae-ad8:southamerica-east1:chepita-mtc"
  CLOUD_SQL_CONNECTION_NAME: "project-d5c1b1cb-efd2-47ae-ad8:southamerica-east1:chepita-mtc"
  IMPORT_MAX_FILE_SIZE_BYTES: "10485760"
  IMPORT_CSV_DELIMITER: ","
  IMPORT_EXCEL_SHEET_NAME: "MOVIMIENTO"
  IMPORT_REQUIRED_COLUMNS: "Registro,Codigo,Serie,Descripcion,Comienzo,Vencimiento,Cliente,Usuario,idalmacen,Fechareg,Documento,Tipodoc,EstadoArtAlqui,GrupoKardex,Entrega,Cierre,Reprinc,Orden,Idmotivo,Reprinc2,cliente final"
  AUTH_TOKEN_TTL_HOURS: "24"
  CORS_ALLOW_ALL_ORIGINS: "true"
  CORS_ALLOWED_ORIGINS: ""
  CORS_ALLOW_CREDENTIALS: "false"
  CORS_PREFLIGHT_MAX_AGE: "86400"
  PAGINATION_DEFAULT_PAGE_SIZE: "20"
  PAGINATION_MAX_PAGE_SIZE: "100"
  SP_IMPORT_EXCEL: "sp_importar_excel"
  SP_IMPORT_CSV: "sp_importar_csv"
  SP_IMPORT_JSON: "sp_importar_json"

beta_settings:
  cloud_sql_instances: "project-d5c1b1cb-efd2-47ae-ad8:southamerica-east1:chepita-mtc"

